services:
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://luma:luma_dev_only@postgres:5432/luma?sslmode=disable
      LUMA_USERID_HMAC_SECRET: ${LUMA_USERID_HMAC_SECRET:?Generate once with openssl rand -hex 32 and store in private .env}
      REDIS_URL: redis://redis:6379/0
      LUMA_ALLOW_INSECURE_LOCAL: "true"
      LOCAL_STORAGE_DIR: /app/storage
    volumes: ["ciphertext:/app/storage"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: luma_dev_only
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
  ciphertext:
