services:
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://luma:luma_dev_only@postgres:5432/luma?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LUMA_ALLOW_INSECURE_LOCAL: "true"
      S3_ENDPOINT: minio:9000
      S3_SECURE: "false"
      S3_BUCKET: luma-ciphertext
      S3_ACCESS_KEY: luma_dev
      S3_SECRET_KEY: luma_dev_secret_change_me
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: luma_dev_only
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data
    environment:
      MINIO_ROOT_USER: luma_dev
      MINIO_ROOT_PASSWORD: luma_dev_secret_change_me
    volumes: ["objects:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 luma_dev luma_dev_secret_change_me; do sleep 2; done; mc mb --ignore-existing local/luma-ciphertext"]
volumes:
  pgdata:
  objects:
