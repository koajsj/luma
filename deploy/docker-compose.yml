name: luma

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      LUMA_ADDR: ":8080"
      LUMA_TRUSTED_PROXY_IP: "172.31.251.2"
      # Only the private Docker network can reach this HTTP listener; Caddy terminates public TLS.
      LUMA_ALLOW_INSECURE_LOCAL: "true"
      LUMA_AUTO_MIGRATE: "false"
      DATABASE_URL: "postgres://luma_api:${LUMA_DATABASE_RUNTIME_PASSWORD:?Prepare a separate runtime password}@postgres:5432/luma?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0"
      LUMA_USERID_HMAC_SECRET: ${LUMA_USERID_HMAC_SECRET:?Set a persistent 32-byte hex UserID HMAC secret}
      LOCAL_STORAGE_DIR: /app/storage
      MIGRATIONS_DIR: /app/migrations
    volumes:
      - /opt/luma/data/storage:/app/storage
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      db-grants: {condition: service_completed_successfully}
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Administrator credentials exist only in PostgreSQL and short-lived jobs.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["/app/luma", "migrate"]
    restart: "no"
    environment:
      LUMA_ALLOW_INSECURE_LOCAL: "true"
      DATABASE_URL: "postgres://luma:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/luma?sslmode=disable"
      LUMA_USERID_HMAC_SECRET: ${LUMA_USERID_HMAC_SECRET:?Set the persistent HMAC secret}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]

  db-grants:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["sh", "/app/database-role.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: luma
      PGUSER: luma
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      LUMA_DATABASE_RUNTIME_PASSWORD: ${LUMA_DATABASE_RUNTIME_PASSWORD:?Prepare a separate runtime password}
    volumes:
      - ./database-role.sh:/app/database-role.sh:ro
      - ../backend/ops/runtime-grants.sql:/app/runtime-grants.sql:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [private]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private env file}
    volumes:
      - /opt/luma/data/postgres:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /opt/luma/data/redis:/data
      - /opt/luma/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LUMA_SITE: ${LUMA_SITE:?Set LUMA_SITE in the private env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
    networks:
      private:
        ipv4_address: 172.31.251.2
      edge:

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.31.251.0/24
  edge:

volumes:
  caddy_data:
  caddy_config:
